---
- name: Delete the Home Dir
  hosts: all
  tasks:
    - name: Display orphan directories selected for deletion
      ansible.builtin.debug:
        msg: "Server: {{ inventory_hostname }} | Directory: {{ item }}"
      loop: "{{ orphan_dirs_by_host[inventory_hostname] | default([]) }}"

    - name: Validate orphan directory paths
      ansible.builtin.assert:
        that:
          - item.startswith('/home/users/') or item.startswith('/home/homeldap/')
          - item not in ['/home/users/', '/home/homeldap/']
        fail_msg: "Invalid deletion path: {{ item }}"
      loop: "{{ orphan_dirs_by_host[inventory_hostname] | default([]) }}"


    - name: Delete the selected orphan home directories
      become: yes
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ orphan_dirs_by_host[inventory_hostname] | default([]) }}"
